name: CI

on:
  push:
    branches: [main, horus/*]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell scripts
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "✓ $f" || echo "✗ $f"
          done
